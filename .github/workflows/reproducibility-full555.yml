  consolidate:

    if: always()

    needs:
      - prepare-matrix
      - run-batch-1
      - run-batch-2
      - run-batch-3

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout methodology repository
        uses: actions/checkout@v4

      - name: Download all repository results
        uses: actions/download-artifact@v4
        with:
          pattern: stage3-batch*-result-*
          path: data/interim/full555_results
          merge-multiple: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install pandas openpyxl

      - name: Consolidate 555 results
        run: |

          python - <<'PY'

          from pathlib import Path
          import pandas as pd

          root = Path(
              "data/interim/full555_results"
          )

          files = sorted(
              root.rglob("*.csv")
          )

          print(
              "Repository result files:",
              len(files)
          )

          frames = []

          for f in files:

              try:

                  df = pd.read_csv(f)

                  if len(df) > 0:
                      frames.append(df)

              except Exception as e:

                  print(
                      "Could not read:",
                      f,
                      e
                  )

          if not frames:

              raise RuntimeError(
                  "No repository result files found."
              )

          result = pd.concat(
              frames,
              ignore_index=True
          )

          result = (
              result
              .drop_duplicates(
                  subset=[
                      "repo_full_name"
                  ],
                  keep="last"
              )
              .reset_index(drop=True)
          )

          print()
          print("=" * 80)
          print("FULL STAGE 3 VALIDATION")
          print("=" * 80)

          print(
              "Rows:",
              len(result)
          )

          print(
              "Unique repositories:",
              result[
                  "repo_full_name"
              ].nunique()
          )

          if len(result) != 555:

              raise RuntimeError(
                  f"Expected 555 rows, "
                  f"found {len(result)}"
              )

          if (
              result[
                  "repo_full_name"
              ].nunique()
              != 555
          ):

              raise RuntimeError(
                  "Expected 555 unique repositories."
              )

          output = Path(
              "data/interim"
          )

          csv_out = (
              output /
              "stage3_full_reproducibility_results.csv"
          )

          xlsx_out = (
              output /
              "stage3_full_reproducibility_results.xlsx"
          )

          result.to_csv(
              csv_out,
              index=False
          )

          status = (
              result[
                  "reproducibility_status"
              ]
              .fillna("UNKNOWN")
              .astype(str)
              .str.upper()
          )

          summary = (
              status
              .value_counts()
              .rename_axis(
                  "reproducibility_status"
              )
              .reset_index(
                  name="count"
              )
          )

          summary[
              "percentage"
          ] = (
              summary["count"]
              / len(result)
              * 100
          ).round(1)

          failures = result[
              status == "FAILED"
          ].copy()

          failure_types = (
              failures[
                  "failure_category"
              ]
              .fillna("UNKNOWN")
              .value_counts()
              .rename_axis(
                  "failure_category"
              )
              .reset_index(
                  name="count"
              )
          )

          if len(failures) > 0:

              failure_types[
                  "percentage_of_failures"
              ] = (
                  failure_types["count"]
                  / len(failures)
                  * 100
              ).round(1)

          else:

              failure_types[
                  "percentage_of_failures"
              ] = []

          with pd.ExcelWriter(
              xlsx_out,
              engine="openpyxl"
          ) as writer:

              result.to_excel(
                  writer,
                  sheet_name="Repository_Results",
                  index=False
              )

              summary.to_excel(
                  writer,
                  sheet_name="Summary",
                  index=False
              )

              failure_types.to_excel(
                  writer,
                  sheet_name="Failure_Types",
                  index=False
              )

          print()
          print(
              summary.to_string(
                  index=False
              )
          )

          print()
          print(
              "CSV:",
              csv_out
          )

          print(
              "Excel:",
              xlsx_out
          )

          PY

      - name: Upload final 555 results
        uses: actions/upload-artifact@v4
        with:
          name: stage3-full-555-final
          path: |
            data/interim/stage3_full_reproducibility_results.csv
            data/interim/stage3_full_reproducibility_results.xlsx
          if-no-files-found: error
          retention-days: 30
