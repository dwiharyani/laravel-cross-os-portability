name: Stage 3 Full Reproducibility 555

on:
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: "Timeout per repository in minutes"
        required: true
        default: "30"

jobs:

  prepare-matrix:

    runs-on: ubuntu-24.04

    outputs:
      batch1: ${{ steps.matrix.outputs.batch1 }}
      batch2: ${{ steps.matrix.outputs.batch2 }}
      batch3: ${{ steps.matrix.outputs.batch3 }}

    steps:

      - name: Checkout methodology repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build 3 repository batches
        id: matrix
        run: |

          python - <<'PY'

          import csv
          import json
          import re
          from pathlib import Path
          from collections import Counter

          INPUT = Path(
              "data/interim/cross_os_candidates.csv"
          )

          def resolve_php_runtime(constraint):

              constraint = (
                  constraint or ""
              ).strip()

              if not constraint:
                  return None

              if re.search(r"(?<!\d)5\.6", constraint):
                  return "5.6"

              if re.search(r"(?<!\d)7\.0", constraint):
                  return "7.4"

              if re.search(r"(?<!\d)7\.1", constraint):
                  return "7.4"

              if re.search(r"(?<!\d)7\.2", constraint):
                  return "7.4"

              if re.search(r"(?<!\d)7\.3", constraint):
                  return "7.4"

              if re.search(r"(?<!\d)7\.4", constraint):
                  return "7.4"

              if re.search(r"(?<!\d)8\.0", constraint):
                  return "8.0"

              if re.search(r"(?<!\d)8\.1", constraint):
                  return "8.1"

              if re.search(r"(?<!\d)8\.2", constraint):
                  return "8.2"

              if re.search(r"(?<!\d)8\.3", constraint):
                  return "8.3"

              if re.search(r"(?<!\d)8\.4", constraint):
                  return "8.4"

              if re.search(r"(?<!\d)8\.5", constraint):
                  return "8.5"

              return None

          rows = []

          with INPUT.open(
              encoding="utf-8",
              newline=""
          ) as f:

              reader = csv.DictReader(f)

              for index, row in enumerate(
                  reader,
                  start=1
              ):

                  repo = row[
                      "repo_full_name"
                  ].strip()

                  constraint = (
                      row.get(
                          "php_version_constraint"
                      )
                      or ""
                  ).strip()

                  php = resolve_php_runtime(
                      constraint
                  )

                  if php is None:

                      raise RuntimeError(
                          "Cannot resolve PHP runtime "
                          f"for {repo}: {constraint}"
                      )

                  rows.append(
                      {
                          "index": index,
                          "repo": repo,
                          "php": php
                      }
                  )

          if len(rows) != 555:

              raise RuntimeError(
                  f"Expected 555 repositories, "
                  f"found {len(rows)}"
              )

          if len(
              {r["repo"] for r in rows}
          ) != 555:

              raise RuntimeError(
                  "Duplicate repositories detected."
              )

          # --------------------------------------------------
          # Split into three batches.
          # 185 + 185 + 185 = 555
          # --------------------------------------------------

          batch1 = rows[0:185]
          batch2 = rows[185:370]
          batch3 = rows[370:555]

          batches = {
              "batch1": batch1,
              "batch2": batch2,
              "batch3": batch3
          }

          for name, batch in batches.items():

              print()
              print(
                  "=" * 70
              )

              print(
                  name,
                  "repositories:",
                  len(batch)
              )

              print(
                  "First:",
                  batch[0]["repo"]
              )

              print(
                  "Last:",
                  batch[-1]["repo"]
              )

              print(
                  "PHP distribution:"
              )

              counts = Counter(
                  r["php"]
                  for r in batch
              )

              for php, count in sorted(
                  counts.items()
              ):

                  print(
                      f"  PHP {php}: {count}"
                  )

          # --------------------------------------------------
          # GitHub output
          # --------------------------------------------------

          for name, batch in batches.items():

              value = json.dumps(
                  {
                      "include": batch
                  },
                  separators=(
                      ",",
                      ":"
                  )
              )

              print(
                  f"{name} matrix entries:",
                  len(batch)
              )

              with open(
                  "${GITHUB_OUTPUT}",
                  "a"
              ) as output:

                  output.write(
                      f"{name}={value}\n"
                  )

          PY


  run-batch-1:

    needs: prepare-matrix

    strategy:
      fail-fast: false
      max-parallel: 20

      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.batch1).include }}

    runs-on: ubuntu-22.04

    timeout-minutes: 35

    steps:

      - name: Checkout methodology repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup repository-specific PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none
          tools: composer

      - name: Install Python dependencies
        run: |
          python -m pip install pandas openpyxl

      - name: Run exact repository
        run: |

          mkdir -p data/interim

          python scripts/09_reproducibility_check.py \
            --input data/interim/cross_os_candidates.csv \
            --repo "${{ matrix.repo }}" \
            --limit 1 \
            --timeout $(( ${{ inputs.timeout_minutes }} * 60 )) \
            --output "data/interim/result_${{ matrix.index }}.csv" \
            --xlsx "data/interim/result_${{ matrix.index }}.xlsx" \
            --manifest "data/interim/result_${{ matrix.index }}.manifest.json" \
            --workspace "data/interim/workspace_${{ matrix.index }}"

      - name: Validate result
        if: always()
        run: |

          python - <<'PY'

          import pandas as pd
          from pathlib import Path

          expected = "${{ matrix.repo }}"

          path = Path(
              "data/interim/result_${{ matrix.index }}.csv"
          )

          if not path.exists():

              raise SystemExit(
                  "Result CSV was not produced."
              )

          df = pd.read_csv(path)

          print(
              "Expected:",
              expected
          )

          print(
              "Rows:",
              len(df)
          )

          if len(df) != 1:

              raise SystemExit(
                  f"Expected 1 row, got {len(df)}"
              )

          actual = str(
              df.iloc[0]["repo_full_name"]
          ).strip()

          if actual != expected:

              raise SystemExit(
                  f"Repository mismatch: "
                  f"{actual} != {expected}"
              )

          PY

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-batch1-result-${{ matrix.index }}
          path: |
            data/interim/result_${{ matrix.index }}.csv
            data/interim/result_${{ matrix.index }}.manifest.json
          if-no-files-found: warn
          retention-days: 7


