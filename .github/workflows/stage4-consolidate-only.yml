name: Stage 4 Consolidate Existing Results

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed Stage 4 run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:

  consolidate:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas openpyxl

      # ==========================================================
      # DOWNLOAD ARTIFACTS FROM THE COMPLETED STAGE 4 RUN
      # ==========================================================

      - name: Download Stage 4 artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: stage4-*
          path: stage4_artifacts
          merge-multiple: true

      # ==========================================================
      # VALIDATE AND CONSOLIDATE
      # ==========================================================

      - name: Consolidate 279 executions
        shell: bash
        run: |

          python - <<'PY'
          import glob
          import json
          import re
          import pandas as pd

          files = sorted(
              set(
                  glob.glob(
                      "stage4_artifacts/**/stage4_result_*.json",
                      recursive=True
                  )
              )
          )

          print("Result files:", len(files))

          if len(files) != 279:
              raise RuntimeError(
                  f"Expected 279 result files, found {len(files)}"
              )

          rows = []

          for filename in files:

              with open(
                  filename,
                  encoding="utf-8"
              ) as f:

                  rows.append(
                      json.load(f)
                  )

          df = pd.DataFrame(rows)

          print("Execution rows:", len(df))

          # ------------------------------------------------------
          # Validate OS
          # ------------------------------------------------------

          print()
          print("OS distribution:")

          print(
              df["os"]
              .value_counts()
              .sort_index()
              .to_string()
          )

          for os_name in [
              "linux",
              "windows",
              "macos"
          ]:

              count = (
                  df["os"] == os_name
              ).sum()

              if count != 93:

                  raise RuntimeError(
                      f"{os_name}: expected 93, found {count}"
                  )

          # ------------------------------------------------------
          # Validate repositories
          # ------------------------------------------------------

          repository_count = (
              df["repo_full_name"]
              .nunique()
          )

          print()
          print(
              "Unique repositories:",
              repository_count
          )

          if repository_count != 93:

              raise RuntimeError(
                  f"Expected 93 repositories, "
                  f"found {repository_count}"
              )

          # ------------------------------------------------------
          # Raw execution results
          # ------------------------------------------------------

          df.to_csv(
              "stage4_cross_os_results.csv",
              index=False
          )

          # ------------------------------------------------------
          # Cross-OS matrix
          # ------------------------------------------------------

          pivot = df.pivot_table(
              index=[
                  "repo_full_name",
                  "latest_sha"
              ],
              columns="os",
              values="reproducibility_status",
              aggfunc="first"
          ).reset_index()

          for os_name in [
              "linux",
              "windows",
              "macos"
          ]:

              if os_name not in pivot.columns:

                  pivot[os_name] = "MISSING"

          def classify(row):

              values = [
                  str(row[x]).upper()
                  for x in [
                      "linux",
                      "windows",
                      "macos"
                  ]
              ]

              if all(
                  x == "REPRODUCIBLE"
                  for x in values
              ):

                  return "ALL_OS_REPRODUCIBLE"

              if (
                  values[0] == "REPRODUCIBLE"
                  and values[1] == "FAILED"
                  and values[2] == "REPRODUCIBLE"
              ):

                  return "WINDOWS_FAILURE"

              if (
                  values[0] == "REPRODUCIBLE"
                  and values[1] == "REPRODUCIBLE"
                  and values[2] == "FAILED"
              ):

                  return "MACOS_FAILURE"

              if (
                  values[0] == "FAILED"
                  and values[1] == "REPRODUCIBLE"
                  and values[2] == "REPRODUCIBLE"
              ):

                  return "LINUX_FAILURE"

              if values.count("FAILED") >= 2:

                  return "MULTI_OS_FAILURE"

              return "INCOMPLETE_OR_OTHER"

          pivot["cross_os_status"] = pivot.apply(
              classify,
              axis=1
          )

          pivot.to_csv(
              "stage4_cross_os_portability.csv",
              index=False
          )

          # ------------------------------------------------------
          # Summary
          # ------------------------------------------------------

          summary = pd.DataFrame(
              [
                  ["Repositories", len(pivot)],
                  ["OS executions", len(df)],
                  [
                      "Linux executions",
                      (df["os"] == "linux").sum()
                  ],
                  [
                      "Windows executions",
                      (df["os"] == "windows").sum()
                  ],
                  [
                      "macOS executions",
                      (df["os"] == "macos").sum()
                  ],
                  [
                      "All three OS reproducible",
                      (
                          pivot["cross_os_status"]
                          == "ALL_OS_REPRODUCIBLE"
                      ).sum()
                  ],
                  [
                      "Windows-specific failure",
                      (
                          pivot["cross_os_status"]
                          == "WINDOWS_FAILURE"
                      ).sum()
                  ],
                  [
                      "macOS-specific failure",
                      (
                          pivot["cross_os_status"]
                          == "MACOS_FAILURE"
                      ).sum()
                  ],
                  [
                      "Linux-specific failure",
                      (
                          pivot["cross_os_status"]
                          == "LINUX_FAILURE"
                      ).sum()
                  ],
                  [
                      "Multi-OS failure",
                      (
                          pivot["cross_os_status"]
                          == "MULTI_OS_FAILURE"
                      ).sum()
                  ],
              ],
              columns=[
                  "metric",
                  "count"
              ]
          )

          summary.to_csv(
              "stage4_cross_os_summary.csv",
              index=False
          )

          # ------------------------------------------------------
          # Excel-safe cleaning
          # ------------------------------------------------------

          illegal = re.compile(
              r"[\x00-\x08\x0B\x0C\x0E-\x1F]"
          )

          def clean(value):

              if isinstance(value, str):

                  return illegal.sub(
                      "",
                      value
                  )

              return value

          excel_df = df.map(clean)
          excel_pivot = pivot.map(clean)
          excel_summary = summary.map(clean)

          # ------------------------------------------------------
          # Excel
          # ------------------------------------------------------

          with pd.ExcelWriter(
              "stage4_cross_os_results.xlsx",
              engine="openpyxl"
          ) as writer:

              excel_df.to_excel(
                  writer,
                  sheet_name="OS_Executions",
                  index=False
              )

              excel_pivot.to_excel(
                  writer,
                  sheet_name="Cross_OS_Portability",
                  index=False
              )

              excel_summary.to_excel(
                  writer,
                  sheet_name="Summary",
                  index=False
              )

          print()
          print("=" * 70)
          print("STAGE 4 CONSOLIDATION SUCCESS")
          print("=" * 70)

          print(
              "Execution rows:",
              len(df)
          )

          print(
              "Repository rows:",
              len(pivot)
          )

          print()
          print(
              summary.to_string(
                  index=False
              )
          )
          PY

      # ==========================================================
      # UPLOAD FINAL FILES
      # ==========================================================

      - name: Upload final Stage 4 results
        uses: actions/upload-artifact@v4
        with:
          name: stage4-final-results
          path: |
            stage4_cross_os_results.csv
            stage4_cross_os_portability.csv
            stage4_cross_os_summary.csv
            stage4_cross_os_results.xlsx
          if-no-files-found: error
          retention-days: 90
