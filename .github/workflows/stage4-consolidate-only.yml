name: Stage 4 Consolidate Existing Results

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed Stage 4 run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:

  consolidate:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas openpyxl

      # ==========================================================
      # GET ARTIFACT LIST
      # ==========================================================

      - name: Get Stage 4 artifact manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p stage4_artifacts

          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["GH_TOKEN"]
          run_id = os.environ["SOURCE_RUN_ID"]

          url = (
              "https://api.github.com/repos/"
              "dwiharyani/laravel-cross-os-portability/"
              "actions/runs/"
              f"{run_id}/artifacts?per_page=100"
          )

          artifacts = []

          page = 1

          while True:

              page_url = (
                  url +
                  f"&page={page}"
              )

              request = urllib.request.Request(
                  page_url,
                  headers={
                      "Accept":
                          "application/vnd.github+json",
                      "Authorization":
                          f"Bearer {token}",
                      "X-GitHub-Api-Version":
                          "2022-11-28",
                  }
              )

              with urllib.request.urlopen(
                  request
              ) as response:

                  data = json.load(response)

              page_items = data.get(
                  "artifacts",
                  []
              )

              print(
                  f"Artifact API page {page}: "
                  f"{len(page_items)} artifacts"
              )

              artifacts.extend(
                  page_items
              )

              if len(page_items) < 100:
                  break

              page += 1

          selected = [
              a for a in artifacts
              if a["name"].startswith("stage4-")
              and not a["expired"]
          ]

          print()
          print(
              "Total artifacts returned:",
              len(artifacts)
          )

          print(
              "Selected Stage 4 artifacts:",
              len(selected)
          )

          if len(selected) != 279:
              raise RuntimeError(
                  "Expected 279 Stage 4 artifacts, "
                  f"found {len(selected)}"
              )

          with open(
              "stage4_artifacts/manifest.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  selected,
                  f,
                  indent=2
              )

          print(
              "Manifest created successfully."
          )
          PY

      # ==========================================================
      # DOWNLOAD EACH ARTIFACT
      # ==========================================================

      - name: Download all 279 Stage 4 artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import subprocess
          import zipfile
          from pathlib import Path

          with open(
              "stage4_artifacts/manifest.json",
              encoding="utf-8"
          ) as f:

              artifacts = json.load(f)

          output = Path(
              "stage4_artifacts"
          )

          for i, artifact in enumerate(
              artifacts,
              start=1
          ):

              artifact_id = artifact["id"]
              artifact_name = artifact["name"]

              print(
                  f"[{i}/279] {artifact_name}"
              )

              url = (
                  "https://api.github.com/repos/"
                  "dwiharyani/laravel-cross-os-portability/"
                  "actions/artifacts/"
                  f"{artifact_id}/zip"
              )

              zip_file = (
                  output /
                  f"artifact_{artifact_id}.zip"
              )

              subprocess.run(
                  [
                      "curl",
                      "--fail",
                      "--silent",
                      "--show-error",
                      "--location",
                      "--retry",
                      "3",
                      "--retry-delay",
                      "2",
                      "-H",
                      "Accept: application/vnd.github+json",
                      "-H",
                      "X-GitHub-Api-Version: 2022-11-28",
                      "-H",
                      f"Authorization: Bearer {os.environ['GH_TOKEN']}",
                      "-o",
                      str(zip_file),
                      url,
                  ],
                  check=True
              )

              with zipfile.ZipFile(
                  zip_file,
                  "r"
              ) as archive:

                  for member in archive.namelist():

                      if (
                          member.endswith(".json")
                          and
                          "stage4_result_" in member
                      ):

                          destination = (
                              output /
                              Path(member).name
                          )

                          with archive.open(
                              member
                          ) as source:

                              destination.write_bytes(
                                  source.read()
                              )

              zip_file.unlink()

          results = list(
              output.glob(
                  "stage4_result_*.json"
              )
          )

          print()
          print(
              "Result files:",
              len(results)
          )

          if len(results) != 279:
              raise RuntimeError(
                  f"Expected 279 result files, "
                  f"found {len(results)}"
              )

          print(
              "ALL 279 RESULTS DOWNLOADED"
          )
          PY

      # ==========================================================
      # CONSOLIDATE
      # ==========================================================

      - name: Consolidate 279 executions
        shell: bash
        run: |

          python - <<'PY'
          import glob
          import json
          import re
          import pandas as pd

          files = sorted(
              glob.glob(
                  "stage4_artifacts/stage4_result_*.json"
              )
          )

          print(
              "Result files:",
              len(files)
          )

          if len(files) != 279:
              raise RuntimeError(
                  f"Expected 279 result files, "
                  f"found {len(files)}"
              )

          rows = []

          for filename in files:

              with open(
                  filename,
                  encoding="utf-8"
              ) as f:

                  rows.append(
                      json.load(f)
                  )

          df = pd.DataFrame(rows)

          print(
              "Execution rows:",
              len(df)
          )

          print()
          print("OS distribution:")

          print(
              df["os"]
              .value_counts()
              .sort_index()
              .to_string()
          )

          for os_name in [
              "linux",
              "windows",
              "macos"
          ]:

              count = (
                  df["os"] == os_name
              ).sum()

              if count != 93:
                  raise RuntimeError(
                      f"{os_name}: expected 93, "
                      f"found {count}"
                  )

          if (
              df["repo_full_name"].nunique()
              != 93
          ):

              raise RuntimeError(
                  "Expected 93 unique repositories."
              )

          df.to_csv(
              "stage4_cross_os_results.csv",
              index=False
          )

          pivot = df.pivot_table(
              index=[
                  "repo_full_name",
                  "latest_sha"
              ],
              columns="os",
              values="reproducibility_status",
              aggfunc="first"
          ).reset_index()

          for os_name in [
              "linux",
              "windows",
              "macos"
          ]:

              if os_name not in pivot.columns:
                  pivot[os_name] = "MISSING"

          def classify(row):

              values = [
                  str(row[x]).upper()
                  for x in [
                      "linux",
                      "windows",
                      "macos"
                  ]
              ]

              if all(
                  x == "REPRODUCIBLE"
                  for x in values
              ):
                  return "ALL_OS_REPRODUCIBLE"

              if (
                  values[0] == "REPRODUCIBLE"
                  and values[1] == "FAILED"
                  and values[2] == "REPRODUCIBLE"
              ):
                  return "WINDOWS_FAILURE"

              if (
                  values[0] == "REPRODUCIBLE"
                  and values[1] == "REPRODUCIBLE"
                  and values[2] == "FAILED"
              ):
                  return "MACOS_FAILURE"

              if (
                  values[0] == "FAILED"
                  and values[1] == "REPRODUCIBLE"
                  and values[2] == "REPRODUCIBLE"
              ):
                  return "LINUX_FAILURE"

              if values.count("FAILED") >= 2:
                  return "MULTI_OS_FAILURE"

              return "INCOMPLETE_OR_OTHER"

          pivot["cross_os_status"] = pivot.apply(
              classify,
              axis=1
          )

          pivot.to_csv(
              "stage4_cross_os_portability.csv",
              index=False
          )

          summary = pd.DataFrame(
              [
                  [
                      "Repositories",
                      len(pivot)
                  ],
                  [
                      "OS executions",
                      len(df)
                  ],
                  [
                      "Linux executions",
                      (df["os"] == "linux").sum()
                  ],
                  [
                      "Windows executions",
                      (df["os"] == "windows").sum()
                  ],
                  [
                      "macOS executions",
                      (df["os"] == "macos").sum()
                  ],
                  [
                      "All three OS reproducible",
                      (
                          pivot["cross_os_status"]
                          == "ALL_OS_REPRODUCIBLE"
                      ).sum()
                  ],
                  [
                      "Windows-specific failure",
                      (
                          pivot["cross_os_status"]
                          == "WINDOWS_FAILURE"
                      ).sum()
                  ],
                  [
                      "macOS-specific failure",
                      (
                          pivot["cross_os_status"]
                          == "MACOS_FAILURE"
                      ).sum()
                  ],
                  [
                      "Linux-specific failure",
                      (
                          pivot["cross_os_status"]
                          == "LINUX_FAILURE"
                      ).sum()
                  ],
                  [
                      "Multi-OS failure",
                      (
                          pivot["cross_os_status"]
                          == "MULTI_OS_FAILURE"
                      ).sum()
                  ],
              ],
              columns=[
                  "metric",
                  "count"
              ]
          )

          summary.to_csv(
              "stage4_cross_os_summary.csv",
              index=False
          )

          illegal = re.compile(
              r"[\x00-\x08\x0B\x0C\x0E-\x1F]"
          )

          def clean(value):

              if isinstance(value, str):
                  return illegal.sub(
                      "",
                      value
                  )

              return value

          excel_df = df.map(clean)
          excel_pivot = pivot.map(clean)
          excel_summary = summary.map(clean)

          with pd.ExcelWriter(
              "stage4_cross_os_results.xlsx",
              engine="openpyxl"
          ) as writer:

              excel_df.to_excel(
                  writer,
                  sheet_name="OS_Executions",
                  index=False
              )

              excel_pivot.to_excel(
                  writer,
                  sheet_name="Cross_OS_Portability",
                  index=False
              )

              excel_summary.to_excel(
                  writer,
                  sheet_name="Summary",
                  index=False
              )

          print()
          print("=" * 70)
          print(
              "STAGE 4 CONSOLIDATION SUCCESS"
          )
          print("=" * 70)

          print(
              summary.to_string(
                  index=False
              )
          )
          PY

      - name: Upload final Stage 4 results
        uses: actions/upload-artifact@v4
        with:
          name: stage4-final-results
          path: |
            stage4_cross_os_results.csv
            stage4_cross_os_portability.csv
            stage4_cross_os_summary.csv
            stage4_cross_os_results.xlsx
          if-no-files-found: error
          retention-days: 90
