name: Stage 4 Windows Rerun - Consolidate

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  consolidate:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas openpyxl

      - name: Download Windows rerun artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: stage4-windows-rerun-*
          path: stage4_windows_artifacts
          merge-multiple: true

      - name: Inspect downloaded results
        shell: bash
        run: |
          set -euo pipefail

          echo "=== DOWNLOADED FILES ==="
          find stage4_windows_artifacts -type f -maxdepth 3 -print | sort

          echo
          echo "=== JSON COUNT ==="
          find stage4_windows_artifacts -type f -name "*.json" | wc -l

      - name: Consolidate 93 Windows executions
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import glob
          import json
          import re
          from pathlib import Path

          import pandas as pd

          ROOT = Path("stage4_windows_artifacts")

          files = sorted(
              ROOT.rglob("*.json")
          )

          print("JSON result files:", len(files))

          if len(files) != 93:
              raise RuntimeError(
                  f"Expected 93 Windows result files, found {len(files)}"
              )

          rows = []

          for filename in files:
              try:
                  with open(
                      filename,
                      encoding="utf-8"
                  ) as f:
                      data = json.load(f)

                  data["_source_file"] = str(filename)
                  rows.append(data)

              except Exception as exc:
                  print(
                      f"ERROR reading {filename}: {exc}"
                  )
                  raise

          df = pd.DataFrame(rows)

          print()
          print("=== RAW RESULT COLUMNS ===")
          print(df.columns.tolist())

          # --------------------------------------------------
          # Normalize important fields
          # --------------------------------------------------

          if "os" not in df.columns:
              df["os"] = "windows"

          if "reproducibility_status" not in df.columns:
              df["reproducibility_status"] = "UNKNOWN"

          df["os"] = df["os"].fillna("windows")
          df["os"] = df["os"].replace("", "windows")

          # Force this workflow's environment label.
          df["os"] = "windows"

          # --------------------------------------------------
          # Classify result
          # --------------------------------------------------

          def classify_status(value):
              value = str(value).upper().strip()

              if value == "REPRODUCIBLE":
                  return "REPRODUCIBLE"

              if value in {
                  "FAILED",
                  "FAIL",
                  "NON_REPRODUCIBLE",
                  "NOT_REPRODUCIBLE"
              }:
                  return "FAILED"

              return value if value else "UNKNOWN"

          df["windows_result"] = df[
              "reproducibility_status"
          ].apply(classify_status)

          # --------------------------------------------------
          # Clean Excel-only values.
          #
          # Keep CSV data untouched.
          # Remove terminal control characters only
          # when creating XLSX.
          # --------------------------------------------------

          CONTROL_CHARS = re.compile(
              r"[\x00-\x08\x0B\x0C\x0E-\x1F]"
          )

          def clean_excel_value(value):
              if isinstance(value, str):
                  return CONTROL_CHARS.sub(
                      "",
                      value
                  )
              return value

          # --------------------------------------------------
          # Save complete CSV
          # --------------------------------------------------

          df.to_csv(
              "stage4_windows_rerun_results.csv",
              index=False
          )

          # --------------------------------------------------
          # Create compact audit table
          # --------------------------------------------------

          preferred = [
              "repo_index",
              "repo_full_name",
              "latest_sha",
              "php_runtime",
              "laravel_version_constraint",
              "os",
              "runner",
              "reproducibility_status",
              "windows_result",
              "failure_category",
              "failure_stage",
              "failure_detail",
              "test_execution",
              "composer_install",
              "clone_status",
              "checkout_status",
              "test_environment_preparation",
              "database_preparation",
              "_source_file",
          ]

          audit_columns = [
              c for c in preferred
              if c in df.columns
          ]

          audit = df[audit_columns].copy()

          audit.to_csv(
              "stage4_windows_rerun_audit.csv",
              index=False
          )

          # --------------------------------------------------
          # Summary
          # --------------------------------------------------

          total = len(df)

          reproducible = (
              df["windows_result"]
              == "REPRODUCIBLE"
          ).sum()

          failed = (
              df["windows_result"]
              == "FAILED"
          ).sum()

          unknown = total - reproducible - failed

          summary = pd.DataFrame(
              [
                  ["Windows executions", total],
                  ["Reproducible", reproducible],
                  ["Failed", failed],
                  ["Unknown/other", unknown],
                  [
                      "Reproducibility rate (%)",
                      round(
                          reproducible / total * 100,
                          2
                      )
                      if total
                      else 0
                  ],
              ],
              columns=[
                  "metric",
                  "count"
              ]
          )

          summary.to_csv(
              "stage4_windows_rerun_summary.csv",
              index=False
          )

          # --------------------------------------------------
          # Failure categories
          # --------------------------------------------------

          if "failure_category" in df.columns:

              failure_df = df[
                  df["windows_result"] == "FAILED"
              ].copy()

              if len(failure_df):

                  failure_categories = (
                      failure_df[
                          "failure_category"
                      ]
                      .fillna("UNKNOWN")
                      .replace("", "UNKNOWN")
                      .value_counts()
                      .rename_axis(
                          "failure_category"
                      )
                      .reset_index(
                          name="count"
                      )
                  )

              else:

                  failure_categories = pd.DataFrame(
                      columns=[
                          "failure_category",
                          "count"
                      ]
                  )

          else:

              failure_categories = pd.DataFrame(
                  columns=[
                      "failure_category",
                      "count"
                  ]
              )

          failure_categories.to_csv(
              "stage4_windows_failure_categories.csv",
              index=False
          )

          # --------------------------------------------------
          # Excel
          # --------------------------------------------------

          excel_df = df.map(
              clean_excel_value
          )

          excel_audit = audit.map(
              clean_excel_value
          )

          excel_summary = summary.map(
              clean_excel_value
          )

          excel_failures = failure_categories.map(
              clean_excel_value
          )

          with pd.ExcelWriter(
              "stage4_windows_rerun_results.xlsx",
              engine="openpyxl"
          ) as writer:

              excel_df.to_excel(
                  writer,
                  sheet_name="All_Executions",
                  index=False
              )

              excel_audit.to_excel(
                  writer,
                  sheet_name="Audit",
                  index=False
              )

              excel_summary.to_excel(
                  writer,
                  sheet_name="Summary",
                  index=False
              )

              excel_failures.to_excel(
                  writer,
                  sheet_name="Failure_Categories",
                  index=False
              )

          # --------------------------------------------------
          # Console report
          # --------------------------------------------------

          print()
          print("==========================================")
          print("STAGE 4 WINDOWS RERUN CONSOLIDATION")
          print("==========================================")
          print(
              f"Total executions : {total}"
          )
          print(
              f"Reproducible     : {reproducible}"
          )
          print(
              f"Failed           : {failed}"
          )
          print(
              f"Unknown/other    : {unknown}"
          )
          print(
              "Reproducibility  : "
              f"{reproducible / total * 100:.2f}%"
              if total
              else "Reproducibility  : 0%"
          )

          print()
          print("Failure categories:")
          print(
              failure_categories.to_string(
                  index=False
              )
          )

          print()
          print("Created:")
          print(
              "stage4_windows_rerun_results.csv"
          )
          print(
              "stage4_windows_rerun_audit.csv"
          )
          print(
              "stage4_windows_rerun_summary.csv"
          )
          print(
              "stage4_windows_failure_categories.csv"
          )
          print(
              "stage4_windows_rerun_results.xlsx"
          )
          PY

      - name: Upload consolidated Windows results
        uses: actions/upload-artifact@v4
        with:
          name: stage4-windows-rerun-final-results
          path: |
            stage4_windows_rerun_results.csv
            stage4_windows_rerun_audit.csv
            stage4_windows_rerun_summary.csv
            stage4_windows_failure_categories.csv
            stage4_windows_rerun_results.xlsx
          retention-days: 90
