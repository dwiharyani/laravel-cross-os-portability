name: Stage 4 Windows Rerun - Consolidate

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID of the completed Stage 4 Windows Rerun"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  consolidate:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas openpyxl

      - name: Download Windows rerun artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          pattern: stage4-windows-rerun-*
          path: stage4_windows_artifacts
          merge-multiple: true

      - name: Inspect downloaded results
        shell: bash
        run: |
          set -euo pipefail

          echo "=== DOWNLOADED FILES ==="

          if [ ! -d "stage4_windows_artifacts" ]; then
            echo "ERROR: stage4_windows_artifacts directory was not created."
            exit 1
          fi

          find stage4_windows_artifacts \
            -type f \
            -print | sort

          echo
          echo "=== JSON COUNT ==="

          JSON_COUNT=$(find stage4_windows_artifacts \
            -type f \
            -name "*.json" | wc -l)

          echo "JSON files: ${JSON_COUNT}"

          if [ "${JSON_COUNT}" -ne 93 ]; then
            echo "ERROR: Expected 93 JSON result files."
            echo "Actual: ${JSON_COUNT}"
            exit 1
          fi

      - name: Consolidate 93 Windows executions
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          import pandas as pd

          ROOT = Path("stage4_windows_artifacts")

          files = sorted(ROOT.rglob("*.json"))

          print("Result files:", len(files))

          if len(files) != 93:
              raise RuntimeError(
                  f"Expected 93 result files, found {len(files)}"
              )

          rows = []

          for filename in files:
              with open(
                  filename,
                  encoding="utf-8"
              ) as f:
                  data = json.load(f)

              data["_source_file"] = str(filename)
              rows.append(data)

          df = pd.DataFrame(rows)

          print("Rows loaded:", len(df))

          # Force Windows label because this is the
          # dedicated Windows rerun.
          df["os"] = "windows"

          if "reproducibility_status" not in df.columns:
              df["reproducibility_status"] = "UNKNOWN"

          def classify(value):
              value = str(value).upper().strip()

              if value == "REPRODUCIBLE":
                  return "REPRODUCIBLE"

              if value in [
                  "FAILED",
                  "FAIL",
                  "NON_REPRODUCIBLE",
                  "NOT_REPRODUCIBLE"
              ]:
                  return "FAILED"

              return "UNKNOWN"

          df["windows_result"] = (
              df["reproducibility_status"]
              .apply(classify)
          )

          # --------------------------------------------------
          # Raw CSV
          # --------------------------------------------------

          df.to_csv(
              "stage4_windows_rerun_results.csv",
              index=False
          )

          # --------------------------------------------------
          # Compact audit table
          # --------------------------------------------------

          preferred = [
              "repo_index",
              "repo_full_name",
              "latest_sha",
              "php_runtime",
              "laravel_version_constraint",
              "os",
              "runner",
              "reproducibility_status",
              "windows_result",
              "failure_category",
              "failure_stage",
              "failure_detail",
              "test_execution",
              "composer_install",
              "clone_status",
              "checkout_status",
              "test_environment_preparation",
              "database_preparation",
              "_source_file",
          ]

          audit_columns = [
              c for c in preferred
              if c in df.columns
          ]

          audit = df[audit_columns].copy()

          audit.to_csv(
              "stage4_windows_rerun_audit.csv",
              index=False
          )

          # --------------------------------------------------
          # Summary
          # --------------------------------------------------

          total = len(df)

          reproducible = (
              df["windows_result"]
              == "REPRODUCIBLE"
          ).sum()

          failed = (
              df["windows_result"]
              == "FAILED"
          ).sum()

          unknown = (
              df["windows_result"]
              == "UNKNOWN"
          ).sum()

          rate = (
              reproducible / total * 100
              if total else 0
          )

          summary = pd.DataFrame(
              [
                  ["Windows executions", total],
                  ["Reproducible", reproducible],
                  ["Failed", failed],
                  ["Unknown", unknown],
                  [
                      "Reproducibility rate (%)",
                      round(rate, 2)
                  ],
              ],
              columns=["metric", "count"]
          )

          summary.to_csv(
              "stage4_windows_rerun_summary.csv",
              index=False
          )

          # --------------------------------------------------
          # Failure categories
          # --------------------------------------------------

          failures = df[
              df["windows_result"] == "FAILED"
          ].copy()

          if (
              len(failures)
              and "failure_category" in failures.columns
          ):
              failure_categories = (
                  failures["failure_category"]
                  .fillna("UNKNOWN")
                  .replace("", "UNKNOWN")
                  .value_counts()
                  .rename_axis("failure_category")
                  .reset_index(name="count")
              )
          else:
              failure_categories = pd.DataFrame(
                  columns=[
                      "failure_category",
                      "count"
                  ]
              )

          failure_categories.to_csv(
              "stage4_windows_failure_categories.csv",
              index=False
          )

          # --------------------------------------------------
          # Excel-safe sanitization
          # --------------------------------------------------

          CONTROL_CHARS = re.compile(
              r"[\x00-\x08\x0B\x0C\x0E-\x1F]"
          )

          def clean(value):
              if isinstance(value, str):
                  return CONTROL_CHARS.sub("", value)
              return value

          excel_df = df.map(clean)
          excel_audit = audit.map(clean)
          excel_summary = summary.map(clean)
          excel_failures = failure_categories.map(clean)

          with pd.ExcelWriter(
              "stage4_windows_rerun_results.xlsx",
              engine="openpyxl"
          ) as writer:

              excel_df.to_excel(
                  writer,
                  sheet_name="All_Executions",
                  index=False
              )

              excel_audit.to_excel(
                  writer,
                  sheet_name="Audit",
                  index=False
              )

              excel_summary.to_excel(
                  writer,
                  sheet_name="Summary",
                  index=False
              )

              excel_failures.to_excel(
                  writer,
                  sheet_name="Failure_Categories",
                  index=False
              )

          print()
          print("==========================================")
          print("WINDOWS RERUN CONSOLIDATION")
          print("==========================================")
          print(f"Total executions : {total}")
          print(f"Reproducible     : {reproducible}")
          print(f"Failed           : {failed}")
          print(f"Unknown          : {unknown}")
          print(f"Reproducibility  : {rate:.2f}%")

          print()
          print("=== FAILURE CATEGORIES ===")
          print(
              failure_categories.to_string(
                  index=False
              )
          )

          print()
          print("=== OUTPUT FILES ===")
          print("stage4_windows_rerun_results.csv")
          print("stage4_windows_rerun_audit.csv")
          print("stage4_windows_rerun_summary.csv")
          print("stage4_windows_failure_categories.csv")
          print("stage4_windows_rerun_results.xlsx")
          PY

      - name: Upload consolidated Windows results
        uses: actions/upload-artifact@v4
        with:
          name: stage4-windows-rerun-final-results
          path: |
            stage4_windows_rerun_results.csv
            stage4_windows_rerun_audit.csv
            stage4_windows_rerun_summary.csv
            stage4_windows_failure_categories.csv
            stage4_windows_rerun_results.xlsx
          retention-days: 90
