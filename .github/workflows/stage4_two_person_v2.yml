name: Stage 4 v2 - Two Person Cross OS

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: "Batch: A01-A07 or B01-B07"
        required: true
        type: string
      max_parallel:
        description: "Maximum simultaneous repository×OS jobs"
        required: true
        default: "12"
        type: string
      attempt:
        description: "Attempt number (1, 2, ...)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate assignment and build 3-OS matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/17_prepare_stage4_execution.py "${{ inputs.batch_id }}" > matrix.json

          python3 - <<'PY'
          import json
          p=json.load(open("matrix.json"))
          items=p.get("include", [])
          assert items
          repos={x["execution_id"] for x in items}
          oses={x["os"] for x in items}
          assert len(items) == len(repos) * 3
          assert oses == {"linux","windows","macos"}
          print("repositories:", len(repos))
          print("OS executions:", len(items))
          print("OS set:", sorted(oses))
          PY

          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  execute:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix).include }}

    runs-on: ${{ matrix.runner }}
    continue-on-error: true

    env:
      STAGE4_EXECUTION_ID: ${{ matrix.execution_id }}
      STAGE4_OWNER: ${{ matrix.execution_owner }}
      STAGE4_BATCH: ${{ matrix.execution_batch }}
      STAGE4_PROJECT_ID: ${{ matrix.project_id }}
      STAGE4_REPO: ${{ matrix.repo_full_name }}
      STAGE4_URL: ${{ matrix.url }}
      STAGE4_SHA: ${{ matrix.latest_sha }}
      STAGE4_BRANCH: ${{ matrix.default_branch }}
      STAGE4_STARS: ${{ matrix.stars_github }}
      STAGE4_FORKS: ${{ matrix.forks_count }}
      STAGE4_POPULARITY_QUARTILE: ${{ matrix.popularity_quartile }}
      STAGE4_DOCKER_STATUS: ${{ matrix.docker_status }}
      STAGE4_PHP: ${{ matrix.php_runtime_requested }}
      STAGE4_PHP_CONSTRAINT: ${{ matrix.php_version_constraint }}
      STAGE4_PHP_SOURCE: ${{ matrix.php_runtime_source }}
      STAGE4_PHP_RESOLUTION: ${{ matrix.php_runtime_resolution }}
      STAGE4_PHP_CONFIDENCE: ${{ matrix.php_runtime_confidence }}
      STAGE4_LARAVEL: ${{ matrix.laravel_version_constraint }}
      STAGE4_TEST_COMMAND: ${{ matrix.test_command_declared }}
      STAGE4_OS: ${{ matrix.os }}
      STAGE4_RUNNER: ${{ matrix.runner }}
      STAGE4_ATTEMPT: ${{ inputs.attempt }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_runtime_requested }}
          extensions: mbstring, xml, curl, zip, fileinfo, pdo, pdo_mysql, pdo_sqlite
          tools: composer
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture runner diagnostics
        shell: bash
        run: |
          mkdir -p preflight
          php --version > preflight/php_version.txt 2>&1 || true
          composer --version > preflight/composer_version.txt 2>&1 || true
          git --version > preflight/git_version.txt 2>&1 || true
          node --version > preflight/node_version.txt 2>&1 || true
          python --version > preflight/python_version.txt 2>&1 || true
          uname -a > preflight/uname.txt 2>&1 || true

      - name: Run Stage 4 execution
        shell: bash
        run: |
          python3 scripts/14_cross_os_reproducibility_v2.py

      - name: Add runner diagnostics to evidence
        if: always()
        shell: bash
        run: |
          mkdir -p stage4_execution/diagnostics
          cp -R preflight/. stage4_execution/diagnostics/ 2>/dev/null || true

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4-${{ matrix.execution_id }}-${{ matrix.os }}-attempt-${{ inputs.attempt }}
          path: stage4_execution
          if-no-files-found: error
          retention-days: 30

  validate:
    if: always()
    needs: [prepare, execute]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate batch matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/17_prepare_stage4_execution.py "${{ inputs.batch_id }}" > matrix.json
          python3 - <<'PY'
          import json
          p=json.load(open("matrix.json"))
          items=p["include"]
          assert len(items) % 3 == 0
          assert {x["os"] for x in items} == {"linux","windows","macos"}
          print("Expected execution artifacts:", len(items))
          print("Batch matrix validation: PASS")
          PY

      - name: Completion notice
        run: |
          echo "Batch ${{ inputs.batch_id }} matrix execution finished."
          echo "Download all stage4-* artifacts before consolidation."
