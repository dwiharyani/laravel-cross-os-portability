name: Stage 4 v2 - Two Person Cross OS

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: "Batch: A01-A07 or B01-B07"
        required: true
        type: string
      max_parallel:
        description: "Maximum simultaneous repository×OS jobs"
        required: true
        default: "10"
        type: string
      attempt:
        description: "Attempt number (1, 2, ...)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:

  # ============================================================
  # PREPARE
  # ============================================================

  prepare:
    name: Prepare ${{ inputs.batch_id }}
    runs-on: ubuntu-22.04

    outputs:
      matrix: ${{ steps.build_matrix.outputs.matrix }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository inputs
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "STAGE 4 PREPARE - INPUT AUDIT"
          echo "============================================================"

          echo "Batch: ${{ inputs.batch_id }}"
          echo "Attempt: ${{ inputs.attempt }}"
          echo "Runner: $(uname -a)"
          echo "Python: $(python3 --version)"

          echo
          echo "Repository:"
          pwd

          echo
          echo "Checking required files..."

          test -f scripts/17_prepare_stage4_execution.py
          echo "OK: scripts/17_prepare_stage4_execution.py"

          test -f data/interim/stage4_two_person_execution_assignment_921.csv
          echo "OK: assignment CSV"

          echo
          echo "Assignment:"
          ls -lh data/interim/stage4_two_person_execution_assignment_921.csv

          echo
          echo "Script:"
          ls -lh scripts/17_prepare_stage4_execution.py

      - name: Build matrix
        id: build_matrix
        shell: bash
        run: |
          set -u

          echo "============================================================"
          echo "STAGE 4 MATRIX GENERATION"
          echo "============================================================"

          rm -f matrix.json
          rm -f prepare_stdout.log
          rm -f prepare_stderr.log

          python3 scripts/17_prepare_stage4_execution.py \
            "${{ inputs.batch_id }}" \
            > matrix.json \
            2> prepare_stderr.log

          RC=$?

          echo
          echo "SCRIPT EXIT CODE: $RC"

          echo
          echo "============================================================"
          echo "PREPARE STDERR"
          echo "============================================================"

          cat prepare_stderr.log || true

          echo
          echo "============================================================"
          echo "MATRIX FILE"
          echo "============================================================"

          if [ -f matrix.json ]; then
            ls -lh matrix.json
            wc -c matrix.json
            head -c 300 matrix.json
            echo
          else
            echo "matrix.json DOES NOT EXIST"
          fi

          if [ "$RC" -ne 0 ]; then
            echo "::error::Stage 4 matrix generator failed with exit code $RC"
            exit "$RC"
          fi

          echo
          echo "============================================================"
          echo "VALIDATING MATRIX JSON"
          echo "============================================================"

          python3 - <<'PY'
          import json
          from collections import Counter

          with open("matrix.json", encoding="utf-8") as f:
              data = json.load(f)

          assert isinstance(data, dict)
          assert "include" in data

          items = data["include"]

          assert len(items) > 0

          repos = {
              x["execution_id"]
              for x in items
          }

          oses = {
              x["os"]
              for x in items
          }

          print("Matrix rows:", len(items))
          print("Repositories:", len(repos))
          print("OS:", sorted(oses))
          print("OS distribution:", Counter(x["os"] for x in items))

          assert len(items) == len(repos) * 3
          assert oses == {
              "linux",
              "windows",
              "macos",
          }

          for x in items:
              required = [
                  "execution_id",
                  "execution_owner",
                  "execution_batch",
                  "project_id",
                  "repo_full_name",
                  "url",
                  "latest_sha",
                  "default_branch",
                  "stars_github",
                  "forks_count",
                  "popularity_quartile",
                  "docker_status",
                  "php_runtime_requested",
                  "php_version_constraint",
                  "php_runtime_source",
                  "php_runtime_resolution",
                  "php_runtime_confidence",
                  "laravel_version_constraint",
                  "test_command_declared",
                  "os",
                  "runner",
              ]

              for key in required:
                  assert key in x, (
                      f"Missing matrix field: {key}"
                  )

              assert x["latest_sha"]
              assert x["repo_full_name"]
              assert x["php_runtime_requested"]
              assert x["php_runtime_resolution"]

          print()
          print("STATUS: MATRIX JSON VALID")
          PY

          echo
          echo "============================================================"
          echo "EXPORTING MATRIX TO GITHUB OUTPUT"
          echo "============================================================"

          {
            echo "matrix<<STAGE4_MATRIX"
            cat matrix.json
            echo "STAGE4_MATRIX"
          } >> "$GITHUB_OUTPUT"

          echo "STATUS: MATRIX OUTPUT EXPORTED"

      - name: Upload prepare diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4-prepare-${{ inputs.batch_id }}-attempt-${{ inputs.attempt }}
          path: |
            matrix.json
            prepare_stdout.log
            prepare_stderr.log
          if-no-files-found: warn
          retention-days: 30


  # ============================================================
  # EXECUTE
  # ============================================================

  execute:
    name: ${{ matrix.execution_id }} - ${{ matrix.os }}
    needs: prepare

    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}

      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix).include }}

    runs-on: ${{ matrix.runner }}

    continue-on-error: true

    env:
      STAGE4_EXECUTION_ID: ${{ matrix.execution_id }}
      STAGE4_OWNER: ${{ matrix.execution_owner }}
      STAGE4_BATCH: ${{ matrix.execution_batch }}
      STAGE4_PROJECT_ID: ${{ matrix.project_id }}
      STAGE4_REPO: ${{ matrix.repo_full_name }}
      STAGE4_URL: ${{ matrix.url }}
      STAGE4_SHA: ${{ matrix.latest_sha }}
      STAGE4_BRANCH: ${{ matrix.default_branch }}
      STAGE4_STARS: ${{ matrix.stars_github }}
      STAGE4_FORKS: ${{ matrix.forks_count }}
      STAGE4_POPULARITY_QUARTILE: ${{ matrix.popularity_quartile }}
      STAGE4_DOCKER_STATUS: ${{ matrix.docker_status }}

      STAGE4_PHP: ${{ matrix.php_runtime_requested }}
      STAGE4_PHP_CONSTRAINT: ${{ matrix.php_version_constraint }}
      STAGE4_PHP_SOURCE: ${{ matrix.php_runtime_source }}
      STAGE4_PHP_RESOLUTION: ${{ matrix.php_runtime_resolution }}
      STAGE4_PHP_CONFIDENCE: ${{ matrix.php_runtime_confidence }}

      STAGE4_LARAVEL: ${{ matrix.laravel_version_constraint }}
      STAGE4_TEST_COMMAND: ${{ matrix.test_command_declared }}

      STAGE4_OS: ${{ matrix.os }}
      STAGE4_RUNNER: ${{ matrix.runner }}
      STAGE4_ATTEMPT: ${{ inputs.attempt }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_runtime_requested }}
          extensions: mbstring, xml, curl, zip, fileinfo, pdo, pdo_mysql, pdo_sqlite
          tools: composer
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture runner diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p preflight

          php --version \
            > preflight/php_version.txt 2>&1 || true

          composer --version \
            > preflight/composer_version.txt 2>&1 || true

          git --version \
            > preflight/git_version.txt 2>&1 || true

          node --version \
            > preflight/node_version.txt 2>&1 || true

          python --version \
            > preflight/python_version.txt 2>&1 || true

          uname -a \
            > preflight/uname.txt 2>&1 || true

      - name: Run Stage 4 execution
        shell: bash
        run: |
          python3 scripts/14_cross_os_reproducibility_v2.py

      - name: Add diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p stage4_execution/diagnostics
          cp -R preflight/. stage4_execution/diagnostics/ 2>/dev/null || true

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4-${{ matrix.execution_id }}-${{ matrix.os }}-attempt-${{ inputs.attempt }}
          path: stage4_execution
          if-no-files-found: warn
          retention-days: 30


  # ============================================================
  # VALIDATE
  # ============================================================

  validate:
    name: Validate ${{ inputs.batch_id }}
    if: always()
    needs:
      - prepare
      - execute

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate assignment and matrix
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "VALIDATION"
          echo "============================================================"

          test -f data/interim/stage4_two_person_execution_assignment_921.csv

          python3 scripts/17_prepare_stage4_execution.py \
            "${{ inputs.batch_id }}" \
            > matrix.json \
            2> validation_stderr.log

          python3 - <<'PY'
          import json
          from collections import Counter

          with open("matrix.json", encoding="utf-8") as f:
              data = json.load(f)

          items = data["include"]

          repos = {
              x["execution_id"]
              for x in items
          }

          print("Repositories:", len(repos))
          print("OS executions:", len(items))
          print("OS distribution:", Counter(x["os"] for x in items))

          assert len(items) == len(repos) * 3
          assert {x["os"] for x in items} == {
              "linux",
              "windows",
              "macos",
          }

          print("STATUS: VALIDATION PASS")
          PY

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4-validation-${{ inputs.batch_id }}-attempt-${{ inputs.attempt }}
          path: |
            matrix.json
            validation_stderr.log
          if-no-files-found: warn
          retention-days: 30

      - name: Completion notice
        if: always()
        run: |
          echo "============================================================"
          echo "Stage 4 batch completed"
          echo "Batch: ${{ inputs.batch_id }}"
          echo "Attempt: ${{ inputs.attempt }}"
          echo "============================================================"
