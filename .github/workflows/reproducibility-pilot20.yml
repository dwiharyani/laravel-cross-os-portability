name: Reproducibility Pilot 20

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  prepare:

    name: Prepare reproducibility matrix

    runs-on: ubuntu-22.04

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Build reproducibility matrix
        id: matrix
        shell: bash

        run: |

          python3 - <<'PY'

          import csv
          import json
          import os

          input_file = "data/interim/php_runtime_matrix.csv"

          include = []

          with open(
              input_file,
              newline="",
              encoding="utf-8"
          ) as f:

              reader = csv.DictReader(f)

              for row in reader:

                  include.append(
                      {
                          "repo": row["repo_full_name"],
                          "sha": row["latest_sha"],
                          "php": str(
                              row["selected_php_runtime"]
                          )
                      }
                  )

          if len(include) != 20:

              raise SystemExit(
                  f"Expected 20 repositories, found {len(include)}"
              )

          matrix = {
              "include": include
          }

          encoded = json.dumps(
              matrix,
              separators=(",", ":")
          )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as f:

              f.write(
                  "matrix=" + encoded + "\n"
              )

          print("Repositories:", len(include))

          for item in include:

              print(
                  item["repo"],
                  "| PHP",
                  item["php"],
                  "| SHA",
                  item["sha"]
              )

          PY


  reproducibility_check:

    name: ${{ matrix.repo }} / PHP ${{ matrix.php }}

    needs: prepare

    strategy:

      fail-fast: false

      max-parallel: 6

      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix).include }}

    runs-on: ubuntu-22.04

    continue-on-error: true

    steps:

      - name: Checkout exact repository

        uses: actions/checkout@v4

        with:

          repository: ${{ matrix.repo }}

          ref: ${{ matrix.sha }}

          fetch-depth: 1


      - name: Initialize evidence

        if: always()

        shell: bash

        run: |

          mkdir -p runtime-result

          cat > runtime-result/requested_environment.txt <<EOF
          repository=${{ matrix.repo }}
          commit_sha=${{ matrix.sha }}
          requested_php=${{ matrix.php }}
          operating_system=ubuntu-22.04
          EOF


      - name: Setup PHP

        id: setup_php

        uses: shivammathur/setup-php@v2

        with:

          php-version: ${{ matrix.php }}

          extensions: mbstring,dom,fileinfo,curl,zip,pdo,sqlite3

          coverage: none

          tools: composer


      - name: Verify PHP and Composer

        if: always()

        shell: bash

        run: |

          set +e

          {

            echo "=== PHP VERSION ==="
            php --version

            echo
            echo "=== PHP INI ==="
            php --ini

            echo
            echo "=== PHP MODULES ==="
            php -m

            echo
            echo "=== COMPOSER ==="
            composer --version

          } > runtime-result/environment.txt 2>&1

          cat runtime-result/environment.txt


      - name: Inspect repository

        if: always()

        shell: bash

        run: |

          set +e

          {

            echo "=== REPOSITORY ==="
            pwd

            echo
            echo "=== FILES ==="
            ls -la

            echo
            echo "=== COMPOSER.JSON ==="

            if [ -f composer.json ]; then
              cat composer.json
            else
              echo "composer.json NOT FOUND"
            fi

          } > runtime-result/repository_inspection.txt 2>&1

          cat runtime-result/repository_inspection.txt


      - name: Composer install

        id: composer_install

        if: always()

        shell: bash

        run: |

          set +e

          if [ ! -f composer.json ]; then

            echo "composer.json not found" \
              > runtime-result/composer_install.txt

            echo "COMPOSER_EXIT_CODE=20" \
              > runtime-result/composer_result.txt

            exit 20

          fi

          timeout 20m composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --no-scripts \
            > runtime-result/composer_install.txt \
            2>&1

          EXIT_CODE=$?

          echo "COMPOSER_EXIT_CODE=$EXIT_CODE" \
            > runtime-result/composer_result.txt

          cat runtime-result/composer_install.txt

          exit $EXIT_CODE


      - name: Detect test command

        if: always()

        shell: bash

        run: |

          set +e

          python3 - <<'PY' \
            > runtime-result/test_detection.txt 2>&1

          import json
          from pathlib import Path

          composer = Path("composer.json")

          if not composer.exists():

              print("TEST_COMMAND=")
              print("SOURCE=composer.json missing")

              raise SystemExit(0)

          with composer.open(
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          scripts = data.get(
              "scripts",
              {}
          )

          preferred = [
              "test",
              "tests",
              "test:unit",
              "test:feature",
          ]

          for name in preferred:

              if name in scripts:

                  print(
                      "TEST_COMMAND="
                      f"composer run {name}"
                  )

                  print(
                      "SOURCE="
                      f"composer.json:{name}"
                  )

                  raise SystemExit(0)

          for name in scripts:

              if "test" in str(name).lower():

                  print(
                      "TEST_COMMAND="
                      f"composer run {name}"
                  )

                  print(
                      "SOURCE="
                      f"composer.json:{name}"
                  )

                  raise SystemExit(0)

          if Path(
              "vendor/bin/phpunit"
          ).exists():

              print(
                  "TEST_COMMAND="
                  "vendor/bin/phpunit"
              )

              print(
                  "SOURCE=vendor/bin/phpunit"
              )

              raise SystemExit(0)

          print("TEST_COMMAND=")
          print("SOURCE=No test command detected")

          PY

          cat runtime-result/test_detection.txt


      - name: Verify timeout command

        if: always()

        shell: bash

        run: |

          command -v timeout

          timeout --version | head -1


      - name: Run tests

        if: always()

        shell: bash

        run: |

          set +e

          if [ ! -d vendor ]; then

            echo "vendor directory does not exist"

            {
              echo "TEST_EXIT_CODE=30"
              echo "TEST_TIMEOUT=0"
              echo "TEST_TIMEOUT_MINUTES=30"
            } > runtime-result/test_result.txt

            exit 30

          fi

          TEST_COMMAND=$(
            grep "^TEST_COMMAND=" \
            runtime-result/test_detection.txt \
            | cut -d= -f2-
          )

          echo "Detected test command:"
          echo "$TEST_COMMAND"

          if [ -z "$TEST_COMMAND" ]; then

            echo "No test command detected"

            {
              echo "TEST_EXIT_CODE=31"
              echo "TEST_TIMEOUT=0"
              echo "TEST_TIMEOUT_MINUTES=30"
            } > runtime-result/test_result.txt

            exit 31

          fi

          echo "=== TEST EXECUTION ===" \
            > runtime-result/test_execution.txt

          echo "Command: $TEST_COMMAND" \
            >> runtime-result/test_execution.txt

          echo "Timeout: 30 minutes" \
            >> runtime-result/test_execution.txt

          echo \
            >> runtime-result/test_execution.txt

          timeout 30m bash -lc "$TEST_COMMAND" \
            >> runtime-result/test_execution.txt \
            2>&1

          EXIT_CODE=$?

          echo \
            >> runtime-result/test_execution.txt

          echo "EXIT_CODE=$EXIT_CODE" \
            >> runtime-result/test_execution.txt

          if [ "$EXIT_CODE" -eq 124 ]; then

            TEST_TIMEOUT=1

          else

            TEST_TIMEOUT=0

          fi

          {
            echo "TEST_EXIT_CODE=$EXIT_CODE"
            echo "TEST_TIMEOUT=$TEST_TIMEOUT"
            echo "TEST_TIMEOUT_MINUTES=30"
          } > runtime-result/test_result.txt

          cat runtime-result/test_execution.txt

          cat runtime-result/test_result.txt

          exit $EXIT_CODE


      - name: Generate reproducibility result

        if: always()

        shell: bash

        run: |

          python3 - <<'PY'

          import json
          import os
          from pathlib import Path

          result_dir = Path(
              "runtime-result"
          )

          def read_file(name):

              path = result_dir / name

              if not path.exists():
                  return ""

              return path.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

          environment = read_file(
              "environment.txt"
          )

          composer_result = read_file(
              "composer_result.txt"
          )

          composer_install = read_file(
              "composer_install.txt"
          )

          test_detection = read_file(
              "test_detection.txt"
          )

          test_result = read_file(
              "test_result.txt"
          )

          test_execution = read_file(
              "test_execution.txt"
          )

          runtime_available = (
              "PHP VERSION" in environment
              and
              "PHP" in environment
          )

          composer_exit = None

          for line in composer_result.splitlines():

              if line.startswith(
                  "COMPOSER_EXIT_CODE="
              ):

                  try:

                      composer_exit = int(
                          line.split("=", 1)[1]
                      )

                  except ValueError:
                      pass

          test_exit = None

          for line in test_result.splitlines():

              if line.startswith(
                  "TEST_EXIT_CODE="
              ):

                  try:

                      test_exit = int(
                          line.split("=", 1)[1]
                      )

                  except ValueError:
                      pass

          test_timeout = (
              "TEST_TIMEOUT=1"
              in test_result
          )

          vendor_exists = Path(
              "vendor"
          ).exists()

          test_command = ""

          for line in test_detection.splitlines():

              if line.startswith(
                  "TEST_COMMAND="
              ):

                  test_command = line.split(
                      "=",
                      1
                  )[1]

          if not runtime_available:

              failure_stage = (
                  "runtime_provisioning"
              )

              failure_category = (
                  "PHP_RUNTIME"
              )

          elif composer_exit != 0:

              failure_stage = (
                  "dependency_installation"
              )

              failure_category = (
                  "COMPOSER"
              )

          elif not vendor_exists:

              failure_stage = (
                  "dependency_installation"
              )

              failure_category = (
                  "VENDOR_MISSING"
              )

          elif not test_command:

              failure_stage = (
                  "test_detection"
              )

              failure_category = (
                  "NO_TEST_COMMAND"
              )

          elif test_timeout:

              failure_stage = (
                  "test_execution"
              )

              failure_category = (
                  "TEST_TIMEOUT"
              )

          elif test_exit != 0:

              failure_stage = (
                  "test_execution"
              )

              failure_category = (
                  "TEST_FAILURE"
              )

          else:

              failure_stage = ""

              failure_category = ""

          if (
              runtime_available
              and
              composer_exit == 0
              and
              vendor_exists
              and
              test_command
              and
              test_exit == 0
          ):

              reproducibility_status = (
                  "REPRODUCIBLE"
              )

          else:

              reproducibility_status = (
                  "NON_REPRODUCIBLE"
              )

          result = {

              "repo_full_name":
                  "${{ matrix.repo }}",

              "commit_sha":
                  "${{ matrix.sha }}",

              "operating_system":
                  "ubuntu-22.04",

              "requested_php":
                  "${{ matrix.php }}",

              "runner_os":
                  os.environ.get(
                      "RUNNER_OS"
                  ),

              "runner_arch":
                  os.environ.get(
                      "RUNNER_ARCH"
                  ),

              "runtime_available":
                  runtime_available,

              "composer_exit_code":
                  composer_exit,

              "vendor_exists":
                  vendor_exists,

              "test_command":
                  test_command,

              "test_exit_code":
                  test_exit,

              "test_timeout":
                  test_timeout,

              "failure_stage":
                  failure_stage,

              "failure_category":
                  failure_category,

              "reproducibility_status":
                  reproducibility_status,

          }

          with open(
              result_dir / "result.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  indent=2
              )

          print(
              json.dumps(
                  result,
                  indent=2
              )
          )

          PY


      - name: Upload reproducibility evidence

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: reproducibility-${{ strategy.job-index }}

          path: runtime-result/

          if-no-files-found: warn

          retention-days: 30
