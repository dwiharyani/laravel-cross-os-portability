name: Reproducibility Pilot 20

on:
  workflow_dispatch:

jobs:

  prepare:
    name: Prepare Pilot 20
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:

      - name: Checkout analysis repository
        uses: actions/checkout@v4

      - name: Build matrix
        id: matrix
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json

          path = "data/interim/reproducibility_pilot20.csv"

          rows = []

          with open(path, newline="", encoding="utf-8") as f:
              reader = csv.DictReader(f)

              for row in reader:
                  rows.append({
                      "repo": row["repo_full_name"],
                      "sha": row["latest_sha"],
                      "php_constraint": row["php_version_constraint"],
                      "laravel_constraint": row["laravel_version_constraint"],
                  })

          print("Pilot repositories:", len(rows))
          print("Unique repositories:", len({r["repo"] for r in rows}))

          matrix = {
              "include": rows
          }

          with open("/tmp/matrix.json", "w", encoding="utf-8") as f:
              json.dump(matrix, f)

          with open(
              __import__("os").environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write(
                  "matrix=" +
                  json.dumps(matrix) +
                  "\n"
              )
          PY


  reproducibility:
    name: ${{ matrix.repo }}

    needs: prepare

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 5

      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:

      # ------------------------------------------------------------
      # 1. Checkout the exact repository revision
      # ------------------------------------------------------------

      - name: Checkout repository at exact SHA
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: application
          fetch-depth: 1


      # ------------------------------------------------------------
      # 2. Detect PHP version
      # ------------------------------------------------------------

      - name: Determine PHP version
        id: php
        shell: bash
        run: |
          CONSTRAINT='${{ matrix.php_constraint }}'

          echo "PHP constraint: $CONSTRAINT"

          PHP_VERSION=""

          if [[ "$CONSTRAINT" =~ 8\.5 ]]; then
            PHP_VERSION="8.5"

          elif [[ "$CONSTRAINT" =~ 8\.4 ]]; then
            PHP_VERSION="8.4"

          elif [[ "$CONSTRAINT" =~ 8\.3 ]]; then
            PHP_VERSION="8.3"

          elif [[ "$CONSTRAINT" =~ 8\.2 ]]; then
            PHP_VERSION="8.2"

          elif [[ "$CONSTRAINT" =~ 8\.1 ]]; then
            PHP_VERSION="8.1"

          elif [[ "$CONSTRAINT" =~ 8\.0 ]]; then
            PHP_VERSION="8.0"

          elif [[ "$CONSTRAINT" =~ 7\.4 ]]; then
            PHP_VERSION="7.4"

          elif [[ "$CONSTRAINT" =~ 7\.3 ]]; then
            PHP_VERSION="7.3"

          elif [[ "$CONSTRAINT" =~ 7\.2 ]]; then
            PHP_VERSION="7.2"

          elif [[ "$CONSTRAINT" =~ 7\.1 ]]; then
            PHP_VERSION="7.1"

          elif [[ "$CONSTRAINT" =~ 7\.0 ]]; then
            PHP_VERSION="7.0"

          elif [[ "$CONSTRAINT" =~ 5\. ]]; then
            PHP_VERSION="5.6"

          else
            PHP_VERSION="8.2"
          fi

          echo "Selected PHP version: $PHP_VERSION"

          echo "version=$PHP_VERSION" >> "$GITHUB_OUTPUT"


      # ------------------------------------------------------------
      # 3. Setup PHP
      # ------------------------------------------------------------

      - name: Setup PHP
        id: setup_php
        continue-on-error: true
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.php.outputs.version }}
          extensions: mbstring, xml, curl, zip, bcmath
          tools: composer
          coverage: none


      # ------------------------------------------------------------
      # 4. Collect environment information
      # ------------------------------------------------------------

      - name: Environment information
        shell: bash
        run: |
          mkdir -p results

          {
            echo "Repository: ${{ matrix.repo }}"
            echo "SHA: ${{ matrix.sha }}"
            echo "PHP constraint: ${{ matrix.php_constraint }}"
            echo "Laravel constraint: ${{ matrix.laravel_constraint }}"
            echo

            echo "Runner:"
            uname -a
            echo

            echo "PHP:"
            php --version || true
            echo

            echo "Composer:"
            composer --version || true
          } | tee results/environment.txt


      # ------------------------------------------------------------
      # 5. Composer validation
      # ------------------------------------------------------------

      - name: Composer validate
        id: composer_validate
        continue-on-error: true
        working-directory: application
        shell: bash
        run: |
          composer validate \
            --no-check-publish \
            --no-interaction


      # ------------------------------------------------------------
      # 6. Check platform requirements from lock file
      # ------------------------------------------------------------

      - name: Composer platform check
        id: platform_check
        continue-on-error: true
        working-directory: application
        shell: bash
        run: |
          if [ -f composer.lock ]; then
            composer check-platform-reqs --lock
          else
            echo "composer.lock not found"
            exit 1
          fi


      # ------------------------------------------------------------
      # 7. Install dependencies
      # ------------------------------------------------------------

      - name: Composer install
        id: composer_install
        continue-on-error: true
        working-directory: application
        shell: bash
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress


      # ------------------------------------------------------------
      # 8. Detect test mechanism
      # ------------------------------------------------------------

      - name: Detect test mechanism
        id: tests
        shell: bash
        run: |
          cd application

          TEST_COMMAND=""

          if [ -f vendor/bin/phpunit ]; then
            TEST_COMMAND="vendor/bin/phpunit"

          elif [ -f vendor/bin/pest ]; then
            TEST_COMMAND="vendor/bin/pest"

          elif [ -f artisan ]; then
            TEST_COMMAND="php artisan test"

          else
            TEST_COMMAND=""
          fi

          echo "Detected test command: $TEST_COMMAND"

          echo "command=$TEST_COMMAND" >> "$GITHUB_OUTPUT"


      # ------------------------------------------------------------
      # 9. Run tests
      # ------------------------------------------------------------

      - name: Run tests
        id: test_execution
        continue-on-error: true
        working-directory: application
        shell: bash
        run: |
          TEST_COMMAND='${{ steps.tests.outputs.command }}'

          if [ -z "$TEST_COMMAND" ]; then
            echo "No supported test command detected."
            exit 2
          fi

          echo "Running: $TEST_COMMAND"

          $TEST_COMMAND


      # ------------------------------------------------------------
      # 10. Create structured result
      # ------------------------------------------------------------

      - name: Create result
        if: always()
        shell: bash
        env:
          REPO: ${{ matrix.repo }}
          SHA: ${{ matrix.sha }}
          PHP_CONSTRAINT: ${{ matrix.php_constraint }}
          LARAVEL_CONSTRAINT: ${{ matrix.laravel_constraint }}

          SETUP_OUTCOME: ${{ steps.setup_php.outcome }}
          VALIDATE_OUTCOME: ${{ steps.composer_validate.outcome }}
          PLATFORM_OUTCOME: ${{ steps.platform_check.outcome }}
          INSTALL_OUTCOME: ${{ steps.composer_install.outcome }}
          TEST_OUTCOME: ${{ steps.test_execution.outcome }}

        run: |
          mkdir -p results

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          result = {
              "repository": os.environ["REPO"],
              "sha": os.environ["SHA"],
              "php_constraint": os.environ["PHP_CONSTRAINT"],
              "laravel_constraint": os.environ["LARAVEL_CONSTRAINT"],

              "setup_php": os.environ["SETUP_OUTCOME"],
              "composer_validate": os.environ["VALIDATE_OUTCOME"],
              "platform_check": os.environ["PLATFORM_OUTCOME"],
              "composer_install": os.environ["INSTALL_OUTCOME"],
              "test_execution": os.environ["TEST_OUTCOME"],

              "timestamp_utc": datetime.now(
                  timezone.utc
              ).isoformat()
          }

          print(json.dumps(result, indent=2))

          with open(
              "results/result.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  result,
                  f,
                  indent=2
              )
          PY


      # ------------------------------------------------------------
      # 11. Upload result
      # ------------------------------------------------------------

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          path: results/
          if-no-files-found: warn
