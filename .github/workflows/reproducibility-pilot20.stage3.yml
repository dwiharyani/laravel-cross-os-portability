name: Stage 3 Reproducibility Pilot

on:
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: "Test timeout in minutes per repository"
        required: true
        default: "30"

jobs:

  # ============================================================
  # JOB 1 — Build repository/runtime matrix
  # ============================================================

  prepare-matrix:
    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:

      - name: Checkout methodology repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build repository/runtime matrix
        id: matrix
        run: |
          python - <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          pilot = Path(
              "data/interim/reproducibility_pilot20.csv"
          )

          rows = []

          def resolve_php_runtime(constraint):
              if not constraint:
                  return None

              value = str(constraint).strip()

              known = {
                  "^8.5": "8.5",
                  "^8.4": "8.4",
                  "^8.3": "8.3",
                  "^8.2": "8.2",
                  "^8.1": "8.1",
                  "^8.0.2": "8.0",
                  "^8.0": "8.0",
                  "^7.4": "7.4",
                  "^7.3|^8.0": "8.0",
                  "^7.2.5": "7.2",
                  "^7.1.3": "7.1",
                  ">=5.6.4": "5.6",
              }

              if value in known:
                  return known[value]

              versions = re.findall(
                  r"(?<!\d)(\d+)\.(\d+)(?:\.\d+)?",
                  value
              )

              candidates = []

              for major, minor in versions:
                  version = f"{major}.{minor}"

                  if version in {
                      "5.6",
                      "7.1",
                      "7.2",
                      "7.3",
                      "7.4",
                      "8.0",
                      "8.1",
                      "8.2",
                      "8.3",
                      "8.4",
                      "8.5",
                  }:
                      candidates.append(version)

              if not candidates:
                  return None

              return max(
                  candidates,
                  key=lambda x: tuple(
                      int(v)
                      for v in x.split(".")
                  )
              )

          with pilot.open(
              encoding="utf-8",
              newline=""
          ) as f:

              reader = csv.DictReader(f)

              for row in reader:

                  repo = row[
                      "repo_full_name"
                  ].strip()

                  constraint = (
                      row.get(
                          "php_version_constraint"
                      )
                      or ""
                  ).strip()

                  php = resolve_php_runtime(
                      constraint
                  )

                  if not php:
                      raise RuntimeError(
                          f"Cannot resolve PHP runtime "
                          f"for {repo}. "
                          f"Constraint: {constraint!r}"
                      )

                  rows.append({
                      "repo": repo,
                      "php": php,
                  })

          repositories = [
              row["repo"]
              for row in rows
          ]

          if len(repositories) != len(
              set(repositories)
          ):
              raise RuntimeError(
                  "Duplicate repository detected."
              )

          matrix = {
              "include": rows
          }

          print("=" * 80)
          print("STAGE 3 RUNTIME MATRIX")
          print("=" * 80)

          for row in rows:
              print(
                  f'{row["repo"]} -> PHP {row["php"]}'
              )

          print("=" * 80)
          print("Repositories:", len(rows))

          matrix_json = json.dumps(
              matrix,
              separators=(",", ":")
          )

          Path(
              "/tmp/stage3_matrix.json"
          ).write_text(
              matrix_json,
              encoding="utf-8"
          )

          PY

          MATRIX_JSON=$(cat /tmp/stage3_matrix.json)

          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"


  # ============================================================
  # JOB 2 — Run one repository
  # ============================================================

  stage3:
    needs: prepare-matrix

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    runs-on: ubuntu-22.04

    timeout-minutes: 40

    steps:

      - name: Checkout methodology repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none
          tools: composer

      - name: Verify runtime
        run: |
          echo "============================================"
          echo "STAGE 3 RUNTIME"
          echo "============================================"

          echo "Repository:"
          echo "${{ matrix.repo }}"

          echo
          echo "Selected PHP:"
          echo "${{ matrix.php }}"

          echo
          php --version

          echo
          composer --version

          echo
          git --version

          echo
          python --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            pandas \
            openpyxl

      - name: Prepare directories
        run: |
          mkdir -p data/interim
          mkdir -p data/interim/reproducibility_workspace

      - name: Create single repository pilot
        env:
          TARGET_REPOSITORY: ${{ matrix.repo }}
        run: |
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          source = Path(
              "data/interim/reproducibility_pilot20.csv"
          )

          target = Path(
              "data/interim/reproducibility_pilot_single.csv"
          )

          repository = os.environ[
              "TARGET_REPOSITORY"
          ]

          with source.open(
              encoding="utf-8",
              newline=""
          ) as f:

              reader = csv.DictReader(f)

              rows = [
                  row
                  for row in reader
                  if row["repo_full_name"].strip()
                  == repository
              ]

          if len(rows) != 1:
              raise RuntimeError(
                  f"Expected exactly one row for "
                  f"{repository}, found {len(rows)}"
              )

          with target.open(
              "w",
              encoding="utf-8",
              newline=""
          ) as f:

              writer = csv.DictWriter(
                  f,
                  fieldnames=rows[0].keys()
              )

              writer.writeheader()
              writer.writerows(rows)

          print(
              f"Created single-repository pilot "
              f"for {repository}"
          )

          PY

      - name: Run Stage 3
        env:
          PYTHONUNBUFFERED: "1"
          STAGE3_TEST_TIMEOUT: ${{ github.event.inputs.timeout_minutes }}
        run: |
          python scripts/09_reproducibility_check.py \
            --input data/interim/cross_os_candidates.csv \
            --pilot data/interim/reproducibility_pilot_single.csv \
            --limit 1 \
            --timeout $((STAGE3_TEST_TIMEOUT * 60))

      - name: Show results
        if: always()
        run: |
          echo "============================================"
          echo "STAGE 3 RESULT"
          echo "============================================"

          echo "Repository:"
          echo "${{ matrix.repo }}"

          echo "PHP:"
          echo "${{ matrix.php }}"

          echo

          if [ -f data/interim/reproducibility_results.csv ]; then
            cat data/interim/reproducibility_results.csv
          else
            echo "No result CSV produced."
          fi

      - name: Upload Stage 3 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-${{ strategy.job-index }}-${{ matrix.repo }}-php-${{ matrix.php }}
          path: |
            data/interim/reproducibility_results.csv
            data/interim/reproducibility_results.xlsx
            data/interim/reproducibility_results.manifest.json
            data/interim/reproducibility_workspace/**
          if-no-files-found: warn
