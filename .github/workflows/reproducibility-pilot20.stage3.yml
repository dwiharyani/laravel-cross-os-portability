name: Stage 3 Reproducibility Pilot

on:
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: "Test timeout in minutes per repository"
        required: true
        default: "30"

jobs:

  # ============================================================
  # JOB 1 — Build repository/runtime matrix
  # ============================================================

  prepare-matrix:

    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:

      - name: Checkout methodology repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build repository/runtime matrix
        id: matrix
        run: |

          python - <<'PY'

          import csv
          import json
          import re
          from pathlib import Path


          pilot = Path(
              "data/interim/reproducibility_pilot20.csv"
          )


          def resolve_php_runtime(constraint):

              constraint = (
                  constraint
                  or ""
              ).strip()

              # ------------------------------------------------
              # Prefer the newest compatible runtime that is
              # explicitly supported by the constraint.
              # ------------------------------------------------

              if not constraint:
                  return None

              # PHP 5.6
              if re.search(
                  r"(?<!\d)5\.6",
                  constraint
              ):
                  return "5.6"

              # PHP 7.x
              if re.search(
                  r"(?<!\d)7\.1",
                  constraint
              ):
                  return "7.4"

              if re.search(
                  r"(?<!\d)7\.2",
                  constraint
              ):
                  return "7.4"

              if re.search(
                  r"(?<!\d)7\.3",
                  constraint
              ):
                  return "7.4"

              if re.search(
                  r"(?<!\d)7\.4",
                  constraint
              ):
                  return "7.4"

              # PHP 8.x
              if re.search(
                  r"(?<!\d)8\.0",
                  constraint
              ):
                  return "8.0"

              if re.search(
                  r"(?<!\d)8\.1",
                  constraint
              ):
                  return "8.1"

              if re.search(
                  r"(?<!\d)8\.2",
                  constraint
              ):
                  return "8.2"

              if re.search(
                  r"(?<!\d)8\.3",
                  constraint
              ):
                  return "8.3"

              if re.search(
                  r"(?<!\d)8\.4",
                  constraint
              ):
                  return "8.4"

              if re.search(
                  r"(?<!\d)8\.5",
                  constraint
              ):
                  return "8.5"

              return None


          rows = []

          with pilot.open(
              encoding="utf-8",
              newline=""
          ) as f:

              reader = csv.DictReader(f)

              for index, row in enumerate(
                  reader,
                  start=1
              ):

                  repo = (
                      row["repo_full_name"]
                      .strip()
                  )

                  constraint = (
                      row.get(
                          "php_version_constraint"
                      )
                      or ""
                  ).strip()

                  php = resolve_php_runtime(
                      constraint
                  )

                  if not php:

                      raise RuntimeError(
                          "Unable to resolve PHP runtime "
                          f"for {repo}: {constraint}"
                      )

                  rows.append(
                      {
                          "repo": repo,
                          "php": php,
                          "repo_index": index,
                      }
                  )


          matrix = {
              "include": rows
          }


          print(
              json.dumps(
                  matrix,
                  indent=2
              )
          )


          Path(
              "/tmp/stage3_matrix.json"
          ).write_text(
              json.dumps(matrix),
              encoding="utf-8"
          )

          PY

          MATRIX_JSON=$(cat /tmp/stage3_matrix.json)

          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"


  # ============================================================
  # JOB 2 — Run one repository
  # ============================================================

  stage3:

    needs: prepare-matrix

    strategy:

      fail-fast: false

      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    runs-on: ubuntu-22.04

    timeout-minutes: 40

    steps:

      # ----------------------------------------------------------
      # Checkout methodology repository
      # ----------------------------------------------------------

      - name: Checkout methodology repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Python
      # ----------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ----------------------------------------------------------
      # PHP runtime
      # ----------------------------------------------------------

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none
          tools: composer


      # ----------------------------------------------------------
      # Verify runtime
      # ----------------------------------------------------------

      - name: Verify runtime
        run: |

          echo "============================================"
          echo "STAGE 3 RUNTIME"
          echo "============================================"

          echo "Repository:"
          echo "${{ matrix.repo }}"

          echo
          echo "Selected PHP:"
          echo "${{ matrix.php }}"

          echo
          php --version

          echo
          composer --version

          echo
          git --version

          echo
          python --version


      # ----------------------------------------------------------
      # Python dependencies
      # ----------------------------------------------------------

      - name: Install Python dependencies
        run: |

          python -m pip install --upgrade pip

          pip install \
            pandas \
            openpyxl


      # ----------------------------------------------------------
      # Prepare directories
      # ----------------------------------------------------------

      - name: Prepare directories
        run: |

          mkdir -p data/interim

          mkdir -p \
            data/interim/reproducibility_workspace


      # ----------------------------------------------------------
      # Create one-repository pilot
      # ----------------------------------------------------------

      - name: Create single repository pilot
        env:
          TARGET_REPOSITORY: ${{ matrix.repo }}

        run: |

          python - <<'PY'

          import csv
          from pathlib import Path
          import os


          source = Path(
              "data/interim/reproducibility_pilot20.csv"
          )

          target = Path(
              "data/interim/reproducibility_pilot20.single.csv"
          )

          target_repo = os.environ[
              "TARGET_REPOSITORY"
          ]


          with source.open(
              encoding="utf-8",
              newline=""
          ) as f:

              reader = csv.DictReader(f)

              rows = list(reader)


          selected = [
              row
              for row in rows
              if row["repo_full_name"].strip()
              == target_repo
          ]


          if not selected:

              raise RuntimeError(
                  "Repository not found: "
                  + target_repo
              )


          with target.open(
              "w",
              encoding="utf-8",
              newline=""
          ) as f:

              writer = csv.DictWriter(
                  f,
                  fieldnames=reader.fieldnames
              )

              writer.writeheader()

              writer.writerows(
                  selected
              )


          print(
              "Repository selected:",
              target_repo
          )

          PY


      # ----------------------------------------------------------
      # Run Stage 3
      # ----------------------------------------------------------

      - name: Run Stage 3
        env:
          STAGE3_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}

        run: |

          TIMEOUT_SECONDS=$(
            python - <<'PY'
          import os

          minutes = int(
              os.environ.get(
                  "STAGE3_TIMEOUT_MINUTES",
                  "30"
              )
          )

          print(
              minutes * 60
          )
          PY
          )

          echo "============================================"
          echo "RUNNING STAGE 3"
          echo "============================================"

          echo "Repository:"
          echo "${{ matrix.repo }}"

          echo "PHP:"
          echo "${{ matrix.php }}"

          echo "Timeout:"
          echo "${TIMEOUT_SECONDS} seconds"

          python \
            scripts/09_reproducibility_check.py \
            --pilot \
            data/interim/reproducibility_pilot20.single.csv \
            --limit 1 \
            --timeout "${TIMEOUT_SECONDS}"


      # ----------------------------------------------------------
      # Show result
      # ----------------------------------------------------------

      - name: Show result
        if: always()
        run: |

          echo "============================================"
          echo "STAGE 3 RESULT"
          echo "============================================"

          if [ -f \
            data/interim/reproducibility_results.csv
          ]; then

            cat \
              data/interim/reproducibility_results.csv

          else

            echo "Result CSV not found."

          fi


      # ----------------------------------------------------------
      # Upload ONLY small repository result
      #
      # IMPORTANT:
      # Do NOT upload reproducibility_workspace.
      # ----------------------------------------------------------

      - name: Upload repository result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-result-${{ matrix.repo_index }}
          path: |
            data/interim/reproducibility_results.csv
            data/interim/reproducibility_results.manifest.json
          if-no-files-found: warn


  # ============================================================
  # JOB 3 — Aggregate all repository results
  # ============================================================

  aggregate-results:

    needs: stage3

    if: ${{ always() }}

    runs-on: ubuntu-24.04

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout methodology repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Download all small repository results
      # ----------------------------------------------------------

      - name: Download repository results
        uses: actions/download-artifact@v4
        with:
          pattern: stage3-result-*
          path: stage3_results
          merge-multiple: false


      # ----------------------------------------------------------
      # Python
      # ----------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ----------------------------------------------------------
      # Python dependencies
      # ----------------------------------------------------------

      - name: Install Python dependencies
        run: |

          python -m pip install --upgrade pip

          pip install \
            pandas \
            openpyxl


      # ----------------------------------------------------------
      # Aggregate results
      # ----------------------------------------------------------

      - name: Aggregate Stage 3 results
        run: |

          python - <<'PY'

          from pathlib import Path
          import pandas as pd
          import json
          import re


          root = Path(
              "stage3_results"
          )


          csv_files = sorted(
              root.glob(
                  "**/reproducibility_results.csv"
              )
          )


          print("=" * 100)
          print("STAGE 3 AGGREGATION")
          print("=" * 100)

          print(
              "Result CSV files found:",
              len(csv_files)
          )


          frames = []


          for path in csv_files:

              print(
                  "Reading:",
                  path
              )

              try:

                  df = pd.read_csv(
                      path
                  )

                  frames.append(
                      df
                  )

              except Exception as exc:

                  print(
                      "FAILED:",
                      path,
                      repr(exc)
                  )


          if not frames:

              raise RuntimeError(
                  "No reproducibility result CSV files found."
              )


          final = pd.concat(
              frames,
              ignore_index=True
          )


          # ------------------------------------------------------
          # Remove accidental duplicates
          # ------------------------------------------------------

          if "repo_full_name" in final.columns:

              final = final.drop_duplicates(
                  subset=[
                      "repo_full_name"
                  ],
                  keep="last"
              )


          # ------------------------------------------------------
          # Sort
          # ------------------------------------------------------

          if "repo_full_name" in final.columns:

              final = final.sort_values(
                  "repo_full_name"
              ).reset_index(
                  drop=True
              )


          # ------------------------------------------------------
          # Output directory
          # ------------------------------------------------------

          output_dir = Path(
              "data/interim"
          )

          output_dir.mkdir(
              parents=True,
              exist_ok=True
          )


          # ------------------------------------------------------
          # CSV
          # ------------------------------------------------------

          output_csv = (
              output_dir
              / "stage3_reproducibility_pilot20_final.csv"
          )


          final.to_csv(
              output_csv,
              index=False
          )


          # ------------------------------------------------------
          # Excel
          # ------------------------------------------------------

          output_xlsx = (
              output_dir
              / "stage3_reproducibility_pilot20_final.xlsx"
          )


          final.to_excel(
              output_xlsx,
              index=False
          )


          # ------------------------------------------------------
          # Summary
          # ------------------------------------------------------

          print()
          print(
              "Final repository rows:",
              len(final)
          )

          print(
              "Final columns:",
              len(final.columns)
          )

          if "reproducibility_status" in final.columns:

              print()
              print(
                  "REPRODUCIBILITY STATUS"
              )

              print(
                  final[
                      "reproducibility_status"
                  ].value_counts(
                      dropna=False
                  ).to_string()
              )


          if "failure_category" in final.columns:

              print()
              print(
                  "FAILURE CATEGORY"
              )

              print(
                  final[
                      "failure_category"
                  ].value_counts(
                      dropna=False
                  ).to_string()
              )


          print()
          print(
              "CSV:",
              output_csv
          )

          print(
              "Excel:",
              output_xlsx
          )


          # ------------------------------------------------------
          # Save aggregation manifest
          # ------------------------------------------------------

          manifest = {

              "stage": "Stage 3",

              "result_files_found":
                  len(csv_files),

              "final_repository_count":
                  len(final),

              "output_csv":
                  str(output_csv),

              "output_xlsx":
                  str(output_xlsx),

              "source_files":
                  [
                      str(p)
                      for p in csv_files
                  ],
          }


          output_manifest = (
              output_dir
              / "stage3_reproducibility_pilot20_final.manifest.json"
          )


          output_manifest.write_text(
              json.dumps(
                  manifest,
                  indent=2
              ),
              encoding="utf-8"
          )


          PY


      # ----------------------------------------------------------
      # Verify final dataset
      # ----------------------------------------------------------

      - name: Verify final dataset
        run: |

          echo "============================================"
          echo "FINAL STAGE 3 DATASET"
          echo "============================================"

          echo
          echo "CSV:"
          ls -lh \
            data/interim/stage3_reproducibility_pilot20_final.csv

          echo
          echo "Excel:"
          ls -lh \
            data/interim/stage3_reproducibility_pilot20_final.xlsx

          echo
          echo "Manifest:"
          ls -lh \
            data/interim/stage3_reproducibility_pilot20_final.manifest.json

          echo
          echo "CSV rows:"
          python - <<'PY'

          import pandas as pd

          path = (
              "data/interim/"
              "stage3_reproducibility_pilot20_final.csv"
          )

          df = pd.read_csv(
              path
          )

          print(
              len(df)
          )

          print()

          print(
              df.to_string(
                  index=False
              )
          )

          PY


      # ----------------------------------------------------------
      # Upload ONE final artifact
      # ----------------------------------------------------------

      - name: Upload final Stage 3 dataset
        uses: actions/upload-artifact@v4
        with:
          name: stage3-final-results
          path: |
            data/interim/stage3_reproducibility_pilot20_final.csv
            data/interim/stage3_reproducibility_pilot20_final.xlsx
            data/interim/stage3_reproducibility_pilot20_final.manifest.json
          if-no-files-found: error
