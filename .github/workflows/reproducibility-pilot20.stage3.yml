name: Stage 3 Reproducibility Pilot

on:
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: "Test timeout in minutes per repository"
        required: true
        default: "30"

jobs:

  # ============================================================
  # JOB 1 — Build repository/runtime matrix
  # ============================================================

  prepare-matrix:

    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:

      - name: Checkout methodology repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build repository/runtime matrix
        id: matrix
        run: |

          python - <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          pilot = Path(
              "data/interim/reproducibility_pilot20.csv"
          )

          rows = []

          def resolve_php_runtime(constraint):

              constraint = (
                  str(constraint or "")
                  .strip()
              )

              if not constraint:
                  return None

              # --------------------------------------------------
              # Extract PHP versions from composer constraint.
              # --------------------------------------------------

              versions = re.findall(
                  r"(?<!\d)(\d+\.\d+)(?!\d)",
                  constraint
              )

              if not versions:
                  return None

              parsed = []

              for version in versions:

                  try:
                      major, minor = map(
                          int,
                          version.split(".")
                      )

                      parsed.append(
                          (major, minor)
                      )

                  except ValueError:
                      continue

              if not parsed:
                  return None

              # --------------------------------------------------
              # Select the highest compatible runtime that is
              # supported by setup-php.
              #
              # PHP 5.6 / 7.x are retained when explicitly required.
              # --------------------------------------------------

              supported = [
                  (5, 6),
                  (7, 4),
                  (8, 0),
                  (8, 1),
                  (8, 2),
                  (8, 3),
                  (8, 4),
                  (8, 5),
              ]

              candidates = []

              for major, minor in parsed:

                  for runtime in supported:

                      if runtime >= (major, minor):
                          candidates.append(runtime)

              if not candidates:
                  return None

              selected = min(
                  candidates,
                  key=lambda x: x
              )

              return f"{selected[0]}.{selected[1]}"

          with pilot.open(
              encoding="utf-8",
              newline=""
          ) as f:

              reader = csv.DictReader(f)

              for row in reader:

                  repo = (
                      row["repo_full_name"]
                      .strip()
                  )

                  constraint = (
                      row.get(
                          "php_version_constraint"
                      )
                      or ""
                  ).strip()

                  php = resolve_php_runtime(
                      constraint
                  )

                  if not php:

                      raise RuntimeError(
                          "Unable to resolve PHP runtime "
                          f"for {repo}: "
                          f"{constraint}"
                      )

                  rows.append(
                      {
                          "repo": repo,
                          "php": php,
                      }
                  )

          matrix = {
              "include": rows
          }

          print(
              json.dumps(
                  matrix,
                  indent=2
              )
          )

          Path(
              "/tmp/stage3_matrix.json"
          ).write_text(
              json.dumps(matrix),
              encoding="utf-8"
          )

          PY

          MATRIX_JSON=$(cat /tmp/stage3_matrix.json)

          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"


  # ============================================================
  # JOB 2 — Run one repository with selected PHP runtime
  # ============================================================

  stage3:

    needs: prepare-matrix

    strategy:

      fail-fast: false

      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    runs-on: ubuntu-22.04

    timeout-minutes: 40

    steps:

      # ----------------------------------------------------------
      # Checkout methodology repository
      # ----------------------------------------------------------

      - name: Checkout methodology repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Python
      # ----------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ----------------------------------------------------------
      # PHP runtime selected for this repository
      # ----------------------------------------------------------

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none
          tools: composer


      # ----------------------------------------------------------
      # Verify runtime
      # ----------------------------------------------------------

      - name: Verify runtime
        run: |

          echo "============================================"
          echo "STAGE 3 RUNTIME"
          echo "============================================"

          echo "Repository:"
          echo "${{ matrix.repo }}"

          echo
          echo "Selected PHP:"
          echo "${{ matrix.php }}"

          echo
          php --version

          echo
          composer --version

          echo
          git --version

          echo
          python --version


      # ----------------------------------------------------------
      # Python dependencies
      # ----------------------------------------------------------

      - name: Install Python dependencies
        run: |

          python -m pip install --upgrade pip

          pip install \
            pandas \
            openpyxl


      # ----------------------------------------------------------
      # Prepare directories
      # ----------------------------------------------------------

      - name: Prepare directories
        run: |

          mkdir -p data/interim

          mkdir -p \
            data/interim/reproducibility_workspace


      # ----------------------------------------------------------
      # Create single repository pilot file
      # ----------------------------------------------------------

      - name: Create single repository pilot
        env:
          TARGET_REPOSITORY: ${{ matrix.repo }}

        run: |

          python - <<'PY'

          import csv
          import os

          source = (
              "data/interim/"
              "reproducibility_pilot20.csv"
          )

          target = (
              "data/interim/"
              "reproducibility_pilot20.single.csv"
          )

          repository = os.environ[
              "TARGET_REPOSITORY"
          ].strip()

          with open(
              source,
              encoding="utf-8",
              newline=""
          ) as source_file:

              reader = csv.DictReader(
                  source_file
              )

              rows = [
                  row
                  for row in reader
                  if row["repo_full_name"].strip()
                  == repository
              ]

          if not rows:

              raise RuntimeError(
                  f"Repository not found: "
                  f"{repository}"
              )

          with open(
              target,
              "w",
              encoding="utf-8",
              newline=""
          ) as target_file:

              writer = csv.DictWriter(
                  target_file,
                  fieldnames=rows[0].keys()
              )

              writer.writeheader()

              writer.writerows(rows)

          print(
              "Created single repository pilot:"
          )

          print(repository)

          PY


      # ----------------------------------------------------------
      # Run Stage 3
      # ----------------------------------------------------------

      - name: Run Stage 3
        env:
          PYTHONUNBUFFERED: "1"
          STAGE3_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}

        run: |

          python scripts/09_reproducibility_check.py \
            --input \
            data/interim/cross_os_candidates.csv \
            --pilot \
            data/interim/reproducibility_pilot20.single.csv \
            --limit 1 \
            --timeout \
            $((STAGE3_TIMEOUT_MINUTES * 60))


      # ----------------------------------------------------------
      # Show results
      # ----------------------------------------------------------

      - name: Show results
        if: always()
        run: |

          echo "============================================"
          echo "STAGE 3 RESULTS"
          echo "============================================"

          if [ -f data/interim/reproducibility_results.csv ]; then

            cat \
              data/interim/reproducibility_results.csv

          else

            echo "No CSV result found."

          fi


      # ----------------------------------------------------------
      # Prepare safe artifact name
      # ----------------------------------------------------------

      - name: Prepare artifact name
        id: artifact_name
        if: always()
        env:
          REPOSITORY: ${{ matrix.repo }}
          PHP_VERSION: ${{ matrix.php }}
        run: |

          SAFE_REPOSITORY=$(
            echo "$REPOSITORY" |
            sed 's#[^A-Za-z0-9._-]#-#g'
          )

          echo \
            "name=stage3-${SAFE_REPOSITORY}-php-${PHP_VERSION}" \
            >> "$GITHUB_OUTPUT"


      # ----------------------------------------------------------
      # Upload Stage 3 result
      # ----------------------------------------------------------

      - name: Upload Stage 3 result
        if: always()
        uses: actions/upload-artifact@v4
        with:

          name: ${{ steps.artifact_name.outputs.name }}

          path: |
            data/interim/reproducibility_results.csv
            data/interim/reproducibility_results.xlsx
            data/interim/reproducibility_results.manifest.json
            data/interim/reproducibility_workspace/**

          if-no-files-found: warn
